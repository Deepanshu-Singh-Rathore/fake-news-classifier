[project]
name = "fakenews"
version = "0.1.0"
description = "Baseline fake news detection (TF-IDF + Logistic Regression)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [ { name = "Deepanshu Singh Rathore" } ]
dependencies = [
  "pandas>=2.0.0",
  "scikit-learn>=1.3.0",
  "joblib>=1.3.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]
## Removed experimental transformer and UI extras after cleanup

[project.scripts]
fakenews-train = "fakenews.train:main"
fakenews-infer = "fakenews.infer:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fakenews", "fakenews.scripts", "fakenews.ui"]
